services:
  webobsidian:
    build: .
    container_name: webobsidian
    init: true
    restart: unless-stopped
    environment:
      WEBOBSIDIAN_PASSWORD: ${WEBOBSIDIAN_PASSWORD:?WEBOBSIDIAN_PASSWORD를 설정하세요}
    volumes:
      - ./vault:/data/vault
    networks:
      - gototop-net

networks:
  gototop-net:
    external: true
